services:
  - type: web
    name: hacktrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py --keep && gunicorn "app:create_app()" --workers 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
